{% extends "base.html" %}
{% block title %}Статистика бронирований — Roomly{% endblock %}
{% block content %}
<h1>Статистика бронирований</h1>
<ul class="list-group">
  {% for item in statistics %}
    <li class="list-group-item d-flex justify-content-between">
      <span>{{ item.room_name }}</span>
      <strong>{{ item.bookings_count }}</strong>
    </li>
  {% empty %}
    <li class="list-group-item">Помещений пока нет.</li>
  {% endfor %}
</ul>
{% endblock %}
